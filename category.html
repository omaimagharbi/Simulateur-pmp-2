<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n-title="brand">PMP Simulateur</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="topbar-mount"></div>

<div class="shell-with-sidebar">
  <div class="category-nav">
    <a class="sidebar-brand" href="dashboard.html"><img src="assets/logo.svg" alt=""><span data-i18n="categories_title">Dashboard</span></a>
    <div id="category-list"></div>
  </div>

  <div>
    <div class="kicker" id="cat-kicker" style="margin-bottom:.4rem"></div>
    <h1 id="cat-title">Catégorie</h1>
    <p id="cat-desc" style="color:var(--ink-700); max-width:56ch; font-size:1.02rem; margin-bottom:2rem"></p>

    <div class="grid-3" id="parts-grid"></div>
    <div id="empty-mount"></div>
  </div>
</div>

<footer class="foot" data-i18n="footer_note">PMP Simulateur — outil d'entraînement non affilié au PMI®.</footer>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/storage.js"></script>
<script src="js/ui.js"></script>
<script>
  applyI18n();
  const catUser = Store.requireUnlocked('activate-voucher.html');
  if (catUser) {
    renderTopbar('dashboard');
    const CATEGORY_META = categoryMeta();
    const params = new URLSearchParams(window.location.search);
    const cat = params.get('cat') || 'Exam';
    const meta = CATEGORY_META[cat] || { label: cat, desc: '', color: 'var(--brass)' };

    document.title = `${meta.label} — ${t('brand')}`;

    // Catégorie demandée hors du périmètre d'accès de l'utilisateur (voucher
    // restreint) : on bloque l'accès même si l'URL est forcée directement,
    // et on redirige vers une catégorie autorisée.
    const catAllowed = Store.canAccessCategory(catUser, cat);
    if (!catAllowed) {
      const fallback = Store.VOUCHER_SCOPE_CATEGORIES.find(c => Store.canAccessCategory(catUser, c));
      window.location.href = fallback ? `category.html?cat=${fallback}` : 'dashboard.html';
    } else {

    // sidebar persistante (mise en avant de la catégorie active ; catégories
    // hors périmètre affichées verrouillées, non cliquables)
    const categoryOrder = ['Predictif', 'Agile', 'Hybride', 'Exam', 'Quiz', 'MiniExam', 'KillMistakes'];
    document.getElementById('category-list').innerHTML = categoryOrder.map(c => {
      const m = CATEGORY_META[c];
      const allowed = Store.canAccessCategory(catUser, c);
      if (!allowed) {
        return `<span class="category-item locked" title="${t('voucher_scope_locked_hint')}" style="opacity:.45; cursor:not-allowed">
          <span class="dot" style="background:${m.color}"></span>${m.label} 🔒
        </span>`;
      }
      return `<a class="category-item ${c === cat ? 'active' : ''}" href="category.html?cat=${c}">
        <span class="dot" style="background:${m.color}"></span>${m.label}
      </a>`;
    }).join('') + `
      <div class="nav-sep"></div>
      <a class="category-item" href="library.html">
        <span class="dot" style="background:#c99a4a"></span>${t('nav_library')}
      </a>
      <a class="category-item" href="chatbot.html">
        <span class="dot" style="background:#7a5cc9"></span>${t('nav_chatbot')}
      </a>${catUser.role === 'admin' ? `
      <a class="category-item" href="books.html">
        <span class="dot" style="background:#2c7a6d"></span>${t('nav_books')}
      </a>` : ''}`;

    document.getElementById('cat-kicker').innerHTML = `<span class="dot" style="background:${meta.color}; display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:.5rem"></span><span class="eyebrow" style="color:${meta.color}">${meta.label}</span>`;
    document.getElementById('cat-title').textContent = meta.label;
    document.getElementById('cat-desc').textContent = meta.desc;

    const questions = cat === 'KillMistakes' ? getMistakeQuestions(catUser.username) : Store.getAllQuestions().filter(q => q.category === cat);
    // "Kill mistakes" reste une session UNIQUE et continue. "Exam" est un cas à
    // part : ce ne sont pas des parties de 10, mais 5 EXAMENS FIXES (champ
    // "examen" 1 à 5 sur chaque question), chacun une session continue de 180
    // questions avec pauses réglementaires, comme un vrai examen blanc complet.
    const isSingleSession = cat === 'KillMistakes';
    const examParts = cat === 'Exam'
      ? [1, 2, 3, 4, 5].map(n => questions.filter(q => q.examen === n)).filter(p => p.length)
      : null;
    const parts = cat === 'Exam' ? examParts : (isSingleSession ? (questions.length ? [questions] : []) : chunkQuestions(questions, 10));

    if (!parts.length) {
      document.getElementById('empty-mount').innerHTML = cat === 'KillMistakes' ? `
        <div class="empty-state card" style="padding:2.2rem">
          <div class="glyph">🎯</div>
          ${t('kill_mistakes_empty')}
        </div>` : `
        <div class="empty-state card" style="padding:2.2rem">
          <div class="glyph">🗂️</div>
          ${t('empty_no_category_admin')}<br>
          ${catUser.role === 'admin' ? `<a href="admin.html" class="btn btn-brass" style="margin-top:1rem">${t('empty_no_category_admin_cta')}</a>` : t('empty_no_category_user_cta')}
        </div>`;
    } else if (cat === 'KillMistakes') {
      document.getElementById('parts-grid').innerHTML = `
        <div class="exam-card card">
          <span class="tag">${parts[0].length} questions</span>
          <h3>${t('kill_mistakes_single_title')}</h3>
          <p>${t('kill_mistakes_single_desc')}</p>
          <a href="quiz.html?cat=${cat}&part=1" class="btn btn-primary btn-block">${t('start_exam')}</a>
        </div>`;
    } else if (cat === 'Exam') {
      // 5 examens fixes et identiques pour tout le monde (même 180 questions
      // à chaque fois pour "Examen 3" par exemple) ; seul l'ordre des questions
      // est mélangé à chaque lancement, pas leur composition.
      document.getElementById('parts-grid').innerHTML = parts.map((p, idx) => {
        const examNo = idx + 1;
        return `
        <div class="exam-card card">
          <span class="tag">${p.length} questions</span>
          <h3>${t('exam_part_label', { n: examNo })}</h3>
          <p>${t('exam_single_desc')}</p>
          ${catUser.role === 'admin' ? `
          <div style="margin-bottom:.5rem">
            <a href="admin.html?cat=${cat}" class="btn btn-ghost btn-sm btn-block">${t('admin_edit_questions')}</a>
          </div>` : ''}
          <a href="quiz.html?cat=${cat}&part=1&exam=${examNo}" class="btn btn-primary btn-block">${t('start_exam')}</a>
        </div>`;
      }).join('');
    } else {
      document.getElementById('parts-grid').innerHTML = parts.map((p, idx) => `
        <div class="exam-card card">
          <span class="tag">${p.length} questions</span>
          <h3>${t('exam_part_label', { n: idx + 1 })}</h3>
          <p>${meta.label}</p>
          ${catUser.role === 'admin' ? `
          <div style="display:flex; gap:.5rem; margin-bottom:.5rem">
            <a href="admin.html?cat=${cat}" class="btn btn-ghost btn-sm" style="flex:1">${t('admin_edit_questions')}</a>
            <button class="btn btn-danger btn-sm" data-delete-part='${JSON.stringify(p.map(q => q.id))}' style="flex:1">${t('admin_delete_part')}</button>
          </div>` : ''}
          <a href="quiz.html?cat=${cat}&part=${idx + 1}" class="btn btn-primary btn-block">${t('start_exam')}</a>
        </div>`).join('');

      if (catUser.role === 'admin') {
        document.querySelectorAll('[data-delete-part]').forEach(btn => {
          btn.addEventListener('click', () => {
            if (!confirm(t('admin_delete_part_confirm'))) return;
            const ids = JSON.parse(btn.dataset.deletePart);
            ids.forEach(id => Store.deleteQuestion(id));
            showToast(t('admin_delete_part_done'));
            window.location.reload();
          });
        });
      }
    }
    } // fin du else (catAllowed)
  }
</script>
</body>
</html>
